
name: Deploy Lead Generation Agent to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: lead-gen-azure-production
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 4. Run frontend lint
      - name: Run frontend lint
        run: npm run lint

      # 5. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 6. Install backend dependencies
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Run backend tests
      - name: Run backend tests
        run: |
          python -m unittest \
            backend.test_lead_division \
            backend.test_access_control \
            backend.test_secret_exposure \
            -v

      # 8. Build React frontend
      - name: Build frontend
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build

      # 9. Verify production build
      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f backend/main.py
          test -f requirements.txt

      # 10. Create deployment ZIP
      - name: Package application
        run: |
          zip -r "$RUNNER_TEMP/lead-gen-agent.zip" . \
            -x ".git/*" \
               "node_modules/*" \
               "venv/*" \
               ".venv/*" \
               "__pycache__/*" \
               "*.pyc" \
               ".env" \
               ".env.*" \
               ".pytest_cache/*"

      # 11. Azure login using GitHub OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 12. Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ${{ runner.temp }}/lead-gen-agent.zip

      # 13. Logout
      - name: Azure logout
        if: always()
        run: az logout
